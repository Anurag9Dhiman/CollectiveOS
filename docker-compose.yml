services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      # Override DATABASE_URL so the app reaches the db container by name
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
    volumes:
      # Mount Google OAuth credentials — keep out of the image
      - ./credentials.json:/app/credentials.json:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro

  # certbot — renews TLS certificates automatically.
  # First-time setup: docker compose run --rm certbot certonly --webroot
  #   --webroot-path /var/www/certbot --email you@example.com
  #   --agree-tos --no-eff-email -d yourdomain.com
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
