# HTTP — serves the app and handles Let's Encrypt ACME challenges.
# After obtaining a certificate, add the HTTPS server block below.
server {
    listen 80;
    server_name _;

    # Let's Encrypt domain verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for SSE streaming — disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}

