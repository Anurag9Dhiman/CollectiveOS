[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collectiveos"
version = "0.1.0"
description = "A portable, installable personal AI assistant framework"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "spotipy>=2.23.0",
    "tavily-python>=0.3.0",
    "apscheduler>=3.10.0",
    "structlog>=24.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "pyaudio>=0.2.14",
    "numpy>=1.24.0",
]

[project.scripts]
collectiveos = "collectiveos.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["collectiveos*"]
